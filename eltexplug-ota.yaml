# Board: Generic - RTL8720CF (2M/992k)  <-- SDK default, совпадает с заводской раскладкой
# Вариант ДЛЯ ЗАЛИВКИ ПО ВОЗДУХУ: заводская таблица разделов не переписывается,
# поэтому образ должен лечь в заводской FW2 -> раскладка 992k (шаг слотов 0xF8000),
# а не 896k (Tuya default, шаг 0xE0000). См. RUNBOOK.md §1.
esphome:
  name: eltexplug
  friendly_name: EltexPlug
  # Уникальный суффикс из последних 3 байт MAC: имя станет вида eltexplug-4f2a1c,
  # mDNS/API/AP тоже получат его — один YAML годится для парка розеток.
  name_add_mac_suffix: true
  includes:
    - bl0937_poll.h         # измеритель U/I/P опросом (hlw8012 на LibreTiny не считает импульсы)

rtl87xx:
  board: generic-rtl8720cf-2mb-992k

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    # SSID не задаём: по умолчанию берётся имя устройства, т.е. с MAC-суффиксом —
    # у каждой розетки своя запасная точка (иначе две рядом не различить)
    password: !secret ap_fallback_password

captive_portal:

# Локальный веб-интерфейс розетки
web_server:
  version: 3

# Источник времени — нужен для суточного счётчика энергии (total_daily_energy)
time:
  - platform: sntp
    # Если розетка работает через Home Assistant, можно вместо SNTP брать время из HA:
    #   - platform: homeassistant

# =====================================================================
#  Железо ELTEX-SW-PLG01 (RTL8720CF) — распиновка
#  GPIOA_x  ==  PAx в LibreTiny/ESPHome
#     Реле ................ PA4  (актив. «1»)
#     Кнопка .............. PA8  (актив. «0», внутр. подтяжка вверх)
#     Индикатор LED ....... PA7  (актив. «0»)
#     Измеритель BL0937/HLW8012:  SEL = PA9,  CF = PA2,  CF1 = PA3
#     Термометр ........... ОТСУТСТВУЕТ на hw 3v0 (не распаян; см. примечание ниже)
# =====================================================================

# ---------- Про датчик температуры ----------
# Термометра на этой плате НЕТ (проверено по прошивке): заводской firmware
# читает заводской блок из flash @0x1FF000 и, если hardware version == 3v0,
# ПРОПУСКАЕТ инициализацию термометра, выставляя его статус в "не запущен".
# Ваш экземпляр: SW-PLG01, HW 3v0, S/N FC00000000, MAC 0C:EE:20:00:00:00 -> hw 3v0,
# то есть LM75 не распаян и температура не работает даже в стоке.
# (Заодно это объясняет, почему I2C-скан не находил 0x48 — отвечать там некому.)
# Защиту имеет смысл строить на мощности/токе — см. закомментированный пример
# в блоке interval ниже.

# ---------- Реле ----------
switch:
  - platform: gpio
    name: "Розетка"
    id: relay
    pin: PA4
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - output.turn_on: led     # реле включено -> индикатор горит (как в стоке)
    on_turn_off:
      - output.turn_off: led

# ---------- Кнопка (переключает реле) ----------
binary_sensor:
  - platform: gpio
    name: "Кнопка"
    pin:
      number: PA8
      mode:
        input: true
        pullup: true
      inverted: true          # кнопка замыкает на землю
    on_press:
      - switch.toggle: relay

  # ПРИМЕЧАНИЕ: датчика перегрева на этой плате НЕТ.
  # Заводская прошивка сама пропускает инициализацию термометра для hw 3v0
  # (ваш экземпляр: SW-PLG01, HW 3v0, S/N FC00000000) — LM75 не распаян.
  # Поэтому ни численной температуры, ни аппаратной линии OS здесь не существует.

# ---------- Светодиод — повторяет состояние реле (как в стоке) ----------
output:
  - platform: gpio
    id: led
    pin:
      number: PA7
      inverted: true          # активен низким уровнем: реле вкл -> LED горит, выкл -> гаснет

# ---------- Опрос измерителя: раз в 10 с меряем и публикуем U/I/P ----------
interval:
  - interval: 10s
    then:
      - lambda: |-
          bl0937::measure();
          if (!isnan(bl0937::voltage)) id(plug_voltage).publish_state(bl0937::voltage);
          if (!isnan(bl0937::current)) id(plug_current).publish_state(bl0937::current);
          if (!isnan(bl0937::power))   id(plug_power).publish_state(bl0937::power);

  # ---------- (опц.) Защита по мощности/току вместо тепловой ----------
  # Термометра нет, но сток защищается ещё и по перегрузке. Аналог на ESPHome:
  # подставьте предел по паспорту вашей розетки (обычно 10 A / 2200 Вт или 16 A / 3680 Вт)
  # и раскомментируйте.
  # - interval: 10s
  #   then:
  #     - if:
  #         condition:
  #           lambda: 'return !isnan(bl0937::power) && bl0937::power > 2200.0f;'
  #         then:
  #           - switch.turn_off: relay
  #           - logger.log: "Перегрузка: реле выключено"

# ---------- Измеритель U / I / P (BL0937) — ОПРОСОМ в C++ (bl0937_poll.h) ----------
# Штатный hlw8012 на LibreTiny НЕ считает импульсы (прерывания не работают) ->
# «везде нули». Диагностика показала реальные импульсы (CF1 = 1684 Гц ≈ 224 В),
# поэтому меряем опросом. Пины подтверждены: SEL=PA9, CF1(U/I)=PA2, CF(P)=PA3.
# Коэффициенты из прошивки: U=0.133390392*f, I=0.010285907*f, P=1.238737500*f.
# Значения публикуются из блока interval ниже (measure() раз в 10 с, ~0.5 c блокировки цикла).
sensor:
  - platform: template
    name: "Напряжение"
    id: plug_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Ток"
    id: plug_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  - platform: template
    name: "Мощность"
    id: plug_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1

  # Суточный расход для энергопанели Home Assistant (не обязателен)
  - platform: total_daily_energy
    name: "Энергия за сутки"
    power_id: plug_power
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001        # Вт·ч -> кВт·ч
  # Датчика температуры на этой плате нет (см. примечание вверху файла).
